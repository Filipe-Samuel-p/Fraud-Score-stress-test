
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: default
data:
  script.js: |
    
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-loadtest
  namespace: default
  labels:
    app: k6-loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600  
  template:
    metadata:
      labels:
        app: k6-loadtest
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "/scripts/script.js"]
          env:
            - name: TARGET_URL
              value: "http://fraud-score.default.svc.cluster.local/transaction"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
